name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Check, three backends, and CLI consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.11.0
      - name: Install pinned official MoonBit SDK
        env:
          MOON_HOME: ${{ runner.temp }}/liberty-moon
          XDG_CACHE_HOME: ${{ runner.temp }}/liberty-cache
        run: |
          python3 tools/bootstrap-ci.py --destination "$MOON_HOME"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
      - name: Record actual source and runtime versions
        run: |
          git rev-parse HEAD
          moon version --all
          node --version
      - name: Enforce contest minimum compiler version
        run: python3 tools/check-moonc-version.py
      - name: Resolve declared dependencies
        run: |
          moon update
          moon tree
      - name: Check supported targets
        run: moon check --target all --deny-warn
      - name: Verify formatting
        run: moon fmt --check
      - name: Test JavaScript
        run: moon test --target js --deny-warn
      - name: Test Wasm GC
        run: moon test --target wasm-gc --deny-warn
      - name: Test native
        run: moon test --target native --deny-warn
      - name: Build release targets
        run: moon build --target all --release --deny-warn
      - name: Build publishable Mooncakes archive
        run: moon package --list
      - name: Exercise real CLI consumers
        run: python3 tools/ci-consumers.py
      - name: Exercise SDC file diagnostics
        run: python3 tools/ci-sdc-diagnostics.py
      - name: Exercise Netlist field diagnostics
        run: python3 tools/ci-netlist-diagnostics.py
      - name: Exercise constraint-context consumers
        run: python3 tools/ci-constraint-context.py
      - name: Exercise path-query public-package and file receivers
        run: python3 tools/ci-path-query.py
      - name: Exercise pin-limit public-package and file receivers
        run: python3 tools/ci-pin-limits.py
      - name: Exercise cell-usage public-package and file receivers
        run: python3 tools/ci-cell-usage.py
      - name: Exercise scalar-reference public-package and file receivers
        run: python3 tools/ci-references.py
      - name: Exercise setup-comparison public-package and report receivers
        run: python3 tools/ci-setup-comparison.py
      - name: Exercise exclusive analysis-report publication
        run: python3 tools/ci-save-analysis.py
      - name: Exercise distinct setup-endpoint priority consumers
        run: python3 tools/ci-setup-priority.py
      - name: Verify exact combinational-cycle participants
        run: python3 tools/ci-cycle-diagnosis.py
      - name: Ensure checks did not modify tracked sources
        run: git diff --exit-code
